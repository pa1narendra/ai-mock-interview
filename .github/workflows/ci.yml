name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so module-level env validation and `next build`
      # succeed - no external service is contacted during CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret-not-real
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm install` (not `npm ci`) so platform-specific optional binaries
        # (esbuild/@emnapi) resolve on the Linux runner even though the lockfile
        # is generated on Windows. Avoids cross-platform `npm ci` sync failures.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Migrations
        # Offline - no database is contacted. `check` catches conflicting or
        # broken migration files; regenerating must produce nothing new, or
        # db/schema.ts was changed without a migration (npm run db:generate).
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          git diff --exit-code drizzle/
          test -z "$(git status --porcelain drizzle/)"

      - name: Build
        run: npm run build
